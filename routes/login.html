<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h2>Login Page</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Enter Email" required /><br/><br/>
        <input type="password" id="password" placeholder="Enter Password" required /><br/><br/>
        <button type="submit">Login</button>
    </form>

    <p id="msg"></p>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://localhost:5000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save token
                    localStorage.setItem("token", data.token);

                    document.getElementById("msg").innerText = "Login successful! Redirecting...";

                    // Redirect to dashboard page
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);

                } else {
                    document.getElementById("msg").innerText = data.message;
                }

            } catch (error) {
                document.getElementById("msg").innerText = "Server error!";
            }
        });
    </script>

</body>
</html>
